services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ticketops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketops_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ticketops}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticketops} -d ${POSTGRES_DB:-ticketops}"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: ticketops-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Added in later modules:
  # keycloak  (Module 7)   jaeger / prometheus / grafana  (Module 7)

volumes:
  pgdata:
  valkeydata:
